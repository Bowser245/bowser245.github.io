<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Page Introuvable - 404</title>

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121214;

            text-align: center;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        h1 {
