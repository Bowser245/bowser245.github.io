<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Introuvable - 404</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --accent-color: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.3);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Effet de lueur en arrière-plan */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-color);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 120px;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--accent-glow);
            letter-spacing: -2px;
            animation: pulse 3s infinite alternate;
        }

        h2 {
            font-size: 24px;
            margin: 20px 0 10px 0;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            line-height: 1.6;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin: 25px 0;
            font-size: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 15px var(--accent-glow); }
            100% { text-shadow: 0 0 30px rgba(255, 71, 87, 0.6); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Oups... Tu t'es perdu dans l'URL ?</h2>
        <p>Cette page n'existe pas ou a été déplacée.</p>
        
        <div class="info-box">
            <p style="margin: 0; color: #dfdfe5;">Mais ne t'inquiète pas, tous les jours des utilisateurs tombent ici.</p>
        </div>
        
        <a href="/" class="btn">Retour à l'accueil</a>
    </div>

</body>
</html>
